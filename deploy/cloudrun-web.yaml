# Cloud Run service — web tier (ADR-004).
# APPLIED BY THE PIPELINE — `${...}` filled by envsubst in the deploy workflows,
# then `gcloud run services replace` on the rendered file. See cloudrun-api.yaml.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: todo-web
  labels:
    app: todo
    unit: web
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      containers:
        - image: ${WEB_IMAGE}
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            # No PORT here — Cloud Run reserves it. See cloudrun-api.yaml.
            # It injects PORT matching the containerPort above; Next's
            # standalone server.js reads it.
            - name: API_URL
              value: ${API_URL}
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
