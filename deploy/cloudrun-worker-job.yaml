# Cloud Run Job — cleanup/outbox worker (ADR-007). Triggered by Cloud Scheduler
# (~every minute) in cloud environments.
# APPLIED BY THE PIPELINE — `${...}` filled by envsubst in the deploy workflows,
# then `gcloud run jobs replace` on the rendered file. See cloudrun-api.yaml.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: todo-worker
  labels:
    app: todo
    unit: worker
spec:
  template:
    spec:
      template:
        spec:
          maxRetries: 3
          timeoutSeconds: 300
          containers:
            - image: ${WORKER_IMAGE}
              env:
                - name: NODE_ENV
                  value: production
                # Set at deploy time as Cloud Run Job env vars. Carry secrets
                # (DB password, email key) — visible to anyone with Cloud Run
                # viewer access. Never committed to source (NFR-MAINT-003).
                - name: DATABASE_URL
                  value: ${DATABASE_URL}
                # Email ships as EMAIL_PROVIDER=log at first deploy (user
                # decision, 2026-08-13): messages are logged, not sent. Switching
                # to a real provider is EMAIL_PROVIDER=smtp + SMTP_URL, no code
                # change. EMAIL_API_KEY stays empty until that switch.
                - name: EMAIL_PROVIDER
                  value: ${EMAIL_PROVIDER}
                - name: EMAIL_FROM
                  value: ${EMAIL_FROM}
                - name: PUBLIC_APP_URL
                  value: ${PUBLIC_APP_URL}
                - name: EMAIL_API_KEY
                  value: ${EMAIL_API_KEY}
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
