name: CI

on:
  push:
    # This repo's default branch is `master`, not `main`. It read `[main]` from
    # scaffolding until the first deploy (2026-08-13), so the push trigger had
    # never once fired — every green run came from `pull_request`.
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://todo:todo@localhost:5432/todo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package + design tokens
        run: npm run build:shared && npm run build:tokens

      - name: Enforce module boundaries
        run: npm run boundaries

      - name: Lint
        run: npm run lint

      - name: Build all units
        run: npm run build

      # Coverage runs here rather than in a step of its own: measured at
      # 9.41s vs 9.43s for the api suite, instrumentation is free, and a
      # second full run would only be a second chance to flake.
      # NFR-MAINT-001 (core modules >= 70%) is enforced by the
      # coverageThresholds in apps/api and apps/worker, so a coverage
      # regression fails this step even when every test passes — which is
      # NFR-MAINT-002's "gated in CI". The api names its core modules
      # (auth, lists, tasks, authz) per the NFR's wording and carries a
      # global floor for the rest; the worker is gated globally.
      # Web is measured but NOT gated: its jest config cannot see async
      # Server Components at all, so a threshold there would gate a
      # deliberately partial denominator.
      - name: Unit tests + coverage
        run: npm run test:cov

      - name: Run DB migrations
        run: npm run db:migrate

      - name: Install Playwright browsers
        run: npm run install:browsers -w @todo/e2e

      - name: End-to-end (walking skeleton)
        run: npm run test -w @todo/e2e
        env:
          CI: "true"

      # DEF-016 is a rotating flake in profile.spec.ts that has never been
      # reproducible locally (repetition, injected save latency and 20x CPU
      # throttling all stayed green). It only appears here, and until now this
      # job discarded the evidence: traces were configured `on-first-retry`
      # with retries at 0, so none was ever written, and nothing was uploaded.
      # Keep this step so the next occurrence is diagnosable instead of guessed.
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
